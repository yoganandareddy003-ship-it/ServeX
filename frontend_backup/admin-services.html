<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services | SERVEX Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<aside class="sidebar">
    <div class="logo"><img src="assets/servex-logo.svg" alt="SERVEX Bike Care"></div>
    <div class="user-box">
        <div class="avatar">🛡️</div>
        <div>
            <small>Administrator</small>
            <strong data-admin-name>Admin</strong>
        </div>
    </div>
    <nav class="nav">
        <a href="admin-dashboard.html">📊 Dashboard</a>
        <a href="admin-users.html">👥 Users</a>
        <a href="admin-vehicles.html">🏍️ Vehicles</a>
        <a href="admin-bookings.html">📅 Bookings</a>
        <a href="admin-services.html" class="active">🔧 Services</a>
    </nav>
    <button class="logout" onclick="adminLogout()">↪ Logout</button>
</aside>

<main class="main">
    <header class="topbar">
        <div>
            <p class="brand-text">SERVEX ADMINISTRATION</p>
            <h1>Services</h1>
            <p class="subtitle">Manage service types, prices and availability.</p>
        </div>
        <button class="btn btn-primary" onclick="openServiceModal()">+ Add Service</button>
    </header>

    <div id="adminMessage" class="alert hidden"></div>

    <section class="card">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Service</th>
                        <th>Description</th>
                        <th>Price</th>
                        <th>Duration</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="servicesBody"></tbody>
            </table>
        </div>
    </section>
</main>

<div id="serviceModal" class="modal hidden">
    <div class="modal-box">
        <div class="modal-header">
            <h2 id="serviceModalTitle">Add Service</h2>
            <button type="button" id="closeServiceModal" class="close" aria-label="Close">×</button>
        </div>
        <form id="serviceForm">
            <div class="form-group">
                <label for="serviceName">Service name</label>
                <input id="serviceName" required maxlength="120">
            </div>
            <div class="form-group">
                <label for="serviceDescription">Description</label>
                <textarea id="serviceDescription" rows="3"></textarea>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label for="servicePrice">Price</label>
                    <input id="servicePrice" type="number" min="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="serviceDuration">Duration (minutes)</label>
                    <input id="serviceDuration" type="number" min="1" step="1" required>
                </div>
            </div>
            <div class="form-group">
                <label><input id="serviceActive" type="checkbox"> Active</label>
            </div>
            <div class="form-actions">
                <button type="button" id="cancelServiceModal" class="btn btn-secondary">Cancel</button>
                <button class="btn btn-primary">Save Service</button>
            </div>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
<script src="js/admin-services.js"></script>
</body>
</html>
