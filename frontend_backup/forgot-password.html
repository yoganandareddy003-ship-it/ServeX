<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SERVEX</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth-page">
    <section class="auth-card">
        <div class="auth-logo"><img src="assets/servex-logo.svg" alt="SERVEX Bike Care"></div>
        <h1>Forgot password?</h1>
        <p class="subtitle">Enter your account email and we’ll send a secure reset link.</p>

        <div id="forgotPasswordAlert" class="alert hidden" aria-live="polite"></div>

        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <button class="btn btn-primary" style="width:100%">Send reset link</button>
        </form>

        <div class="auth-footer"><a href="login.html">Back to login</a></div>
    </section>
</main>
<script src="js/api.js"></script>
<script src="js/password-reset.js"></script>
</body>
</html>
