<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service History | SERVEX</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo"><img src="assets/servex-logo.svg" alt="SERVEX Bike Care"></div>

        <div class="user-box">
            <div class="avatar">👤</div>
            <div>
                <small>Welcome</small>
                <strong data-user-name>User</strong>
            </div>
        </div>

        <nav class="nav">
            <a href="dashboard.html" class="">🏠 Dashboard</a>
            <a href="my-vehicles.html" class="">🏍️ My Vehicles</a>
            <a href="book-service.html" class="">🛠️ Book Service</a>
            <a href="service-history.html" class="active">📋 Service History</a>
        </nav>

        <button class="logout" onclick="logout()">↪ Logout</button>
    </aside>

    <main class="main">

<header class="topbar">
    <div>
        <p class="brand-text">SERVEX BIKE CARE</p>
        <h1>Service History</h1>
        <p class="subtitle">View your previous bike service records.</p>
    </div>

    <div class="header-icon">📋</div>
</header>

<section class="card">

    <div class="card-title">
        <div>
            <h2>Service Records</h2>
            <p>Your completed service history.</p>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Vehicle</th>
                    <th>Registration</th>
                    <th>Service</th>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="historyBody"></tbody>
        </table>
    </div>

</section>

    </main>

<script src="js/api.js"></script>
<script src="js/history.js"></script>
</body>
</html>
