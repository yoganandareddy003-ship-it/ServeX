<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vehicles | SERVEX</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/history.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo"><img src="assets/servex-logo.svg" alt="SERVEX Bike Care"></div>

        <div class="user-box">
            <div class="avatar">👤</div>
            <div>
                <small>Welcome</small>
                <strong data-user-name>User</strong>
            </div>
        </div>

        <nav class="nav">
            <a href="dashboard.html" class="">🏠 Dashboard</a>
            <a href="my-vehicles.html" class="active">🏍️ My Vehicles</a>
            <a href="book-service.html" class="">🛠️ Book Service</a>
            <a href="service-history.html" class="">📋 Service History</a>
        </nav>

        <button class="logout" onclick="logout()">↪ Logout</button>
    </aside>

    <main class="main">

<header class="topbar">
    <div>
        <p class="brand-text">SERVEX BIKE CARE</p>
        <h1>My Vehicles</h1>
        <p class="subtitle">Keep all your bike details in one place.</p>
    </div>

    <button class="btn btn-primary" onclick="openAddModal()">
        + Add Bike
    </button>
</header>

<div id="pageMessage" class="alert hidden"></div>

<section id="vehicleList" class="vehicle-grid"></section>

<div id="vehicleModal" class="modal hidden">
    <div class="modal-box">

        <div class="modal-header">
            <h2 id="modalTitle">Add Bike</h2>
            <button id="closeModal" class="close">×</button>
        </div>

        <form id="vehicleForm">

            <div class="grid-2">

                <div class="form-group">
                    <label>Brand</label>
                    <input id="brand" placeholder="Honda, Yamaha..." required>
                </div>

                <div class="form-group">
                    <label>Model</label>
                    <input id="model" placeholder="Activa, R15..." required>
                </div>

                <div class="form-group">
                    <label>Registration Number</label>
                    <input id="registration" placeholder="KA01AB1234" required>
                </div>

                <div class="form-group">
                    <label>Manufacturing Year</label>
                    <input id="year" type="number" min="1980" max="2100">
                </div>

                <div class="form-group">
                    <label>Fuel Type</label>
                    <select id="fuel">
                        <option value="">Select fuel</option>
                        <option>Petrol</option>
                        <option>Electric</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Color</label>
                    <input id="color" placeholder="Black">
                </div>

                <div class="form-group">
                    <label>Purchase Date</label>
                    <input id="purchaseDate" type="date">
                </div>

            </div>

            <div class="form-actions">
                <button type="button" id="cancelModal" class="btn btn-secondary">
                    Cancel
                </button>
                <button class="btn btn-primary">
                    Save Bike
                </button>
            </div>

        </form>
    </div>
</div>

    </main>

<script src="js/api.js"></script>
<script src="js/vehicles.js"></script>
</body>
</html>
