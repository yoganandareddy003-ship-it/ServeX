<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SERVEX</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo"><img src="assets/servex-logo.svg" alt="SERVEX Bike Care"></div>
        <p class="brand-text">ADMIN PORTAL</p>
        <h1>Administrator Login</h1>
        <p class="subtitle">Manage users, vehicles, bookings and services.</p>

        <div id="adminLoginAlert" class="alert hidden"></div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input id="email" type="email" placeholder="admin@servex.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input id="password" type="password" placeholder="Admin password" required>
            </div>

            <button class="btn btn-primary" style="width:100%">
                Login as Administrator
            </button>
        </form>

        <div class="auth-footer">
            <a href="login.html">← User Login</a>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
