<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users | SERVEX Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-page">
<aside class="sidebar">
    <div class="logo"><img src="assets/servex-logo.svg" alt="SERVEX Bike Care"></div>
    <div class="user-box">
        <div class="avatar">🛡️</div>
        <div>
            <small>Administrator</small>
            <strong data-admin-name>Admin</strong>
        </div>
    </div>
    <nav class="nav"><a href="admin-dashboard.html" class="">📊 Dashboard</a>
<a href="admin-users.html" class="active">👥 Users</a>
<a href="admin-vehicles.html" class="">🏍️ Vehicles</a>
<a href="admin-bookings.html" class="">📅 Bookings</a>
<a href="admin-services.html" class="">🔧 Services</a></nav>
    <button class="logout" onclick="adminLogout()">↪ Logout</button>
</aside>

<main class="main">

<header class="topbar">
    <div>
        <p class="brand-text">SERVEX ADMINISTRATION</p>
        <h1>Users</h1>
        <p class="subtitle">View and manage registered accounts.</p>
    </div>
</header>

<div id="adminMessage" class="alert hidden"></div>

<section class="card">
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>User</th>
                    <th>Phone</th>
                    <th>Vehicles</th>
                    <th>Role</th>
                    <th>Registered</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersBody"></tbody>
        </table>
    </div>
</section>

</main>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
<script src="js/admin-users.js"></script>
</body>
</html>
