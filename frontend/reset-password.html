<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Password | SERVEX</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth-page">
    <section class="auth-card">
        <div class="auth-logo"><img src="assets/servex-logo.svg" alt="SERVEX Bike Care"></div>
        <h1>Create a new password</h1>
        <p class="subtitle">Choose a new password for your account.</p>

        <div id="resetPasswordAlert" class="alert hidden" aria-live="polite"></div>

        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="password">New Password</label>
                <input id="password" type="password" minlength="6" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
            </div>
            <button class="btn btn-primary" style="width:100%">Update password</button>
        </form>

        <div class="auth-footer"><a href="login.html">Back to login</a></div>
    </section>
</main>
<script src="js/api.js"></script>
<script src="js/password-reset.js"></script>
</body>
</html>
