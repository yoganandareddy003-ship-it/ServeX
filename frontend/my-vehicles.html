<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vehicles | SERVEX</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/history.css">
</head>
<body class="customer-page customer-vehicles">

    <aside class="sidebar">
        <div class="logo"><img src="assets/servex-logo.svg" alt="SERVEX Bike Care"></div>

        <div class="user-box">
            <div class="avatar">👤</div>
            <div>
                <small>Welcome</small>
                <strong data-user-name>User</strong>
            </div>
        </div>

        <nav class="nav">
            <a href="dashboard.html" class="">🏠 Dashboard</a>
            <a href="my-vehicles.html" class="active">🏍️ My Vehicles</a>
            <a href="book-service.html" class="">🛠️ Book Service</a>
            <a href="service-history.html" class="">📋 Service History</a>
        </nav>

        <button class="logout" onclick="logout()">↪ Logout</button>
    </aside>

    <main class="main">

<header class="topbar portal-page-header">
    <div class="portal-heading">
        <nav class="portal-breadcrumbs" aria-label="Breadcrumb">
            <a href="dashboard.html">Home</a>
            <span aria-hidden="true">/</span>
            <span aria-current="page">Vehicles</span>
        </nav>
        <h1>My Vehicles</h1>
        <p class="subtitle">Your garage, ready for every ride.</p>
    </div>
    <button class="portal-action" type="button" onclick="openAddModal()">
        <span aria-hidden="true">+</span> Add New Bike
    </button>
</header>

<div id="pageMessage" class="alert hidden"></div>

<div id="vehicleSearchPanel" class="vehicle-search" hidden>
    <div class="vehicle-search-control">
        <label for="vehicleSearch">Search vehicles</label>
        <input
            id="vehicleSearch"
            type="search"
            placeholder="Brand, model, or registration"
            autocomplete="off"
            aria-controls="vehicleList"
        >
    </div>
    <div id="vehicleSearchEmpty" class="search-empty-state vehicle-search-empty" role="status" hidden>
        <span class="search-empty-illustration" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false">
                <circle cx="19" cy="19" r="10"></circle>
                <path d="m26.5 26.5 9 9M12 31h7l5-7h6l5 7M19 31l5-7m0 0 4 7"></path>
                <circle cx="12" cy="31" r="3"></circle>
                <circle cx="35" cy="31" r="3"></circle>
            </svg>
        </span>
        <span class="search-empty-copy">
            <strong>No bikes found</strong>
            <span>Try another brand, model, or registration.</span>
        </span>
        <button id="clearVehicleSearch" class="search-empty-reset" type="button">Clear search</button>
    </div>
</div>

<section id="vehicleList" class="vehicle-grid"></section>

<div id="vehicleModal" class="modal hidden">
    <div class="modal-box">

        <div class="modal-header">
            <h2 id="modalTitle">Add Bike</h2>
            <button id="closeModal" class="close">×</button>
        </div>

        <form id="vehicleForm">

            <div class="grid-2">

                <div class="form-group">
                    <label>Brand</label>
                    <input id="brand" placeholder="Honda, Yamaha..." required>
                </div>

                <div class="form-group">
                    <label>Model</label>
                    <input id="model" placeholder="Activa, R15..." required>
                </div>

                <div class="form-group">
                    <label>Registration Number</label>
                    <input id="registration" placeholder="KA01AB1234" required>
                </div>

                <div class="form-group">
                    <label>Manufacturing Year</label>
                    <input id="year" type="number" min="1980" max="2100">
                </div>

                <div class="form-group">
                    <label>Fuel Type</label>
                    <select id="fuel">
                        <option value="">Select fuel</option>
                        <option>Petrol</option>
                        <option>Electric</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Color</label>
                    <input id="color" placeholder="Black">
                </div>

                <div class="form-group">
                    <label>Purchase Date</label>
                    <input id="purchaseDate" type="date">
                </div>

            </div>

            <div class="form-actions">
                <button type="button" id="cancelModal" class="btn btn-secondary">
                    Cancel
                </button>
                <button class="btn btn-primary">
                    Save Bike
                </button>
            </div>

        </form>
    </div>
</div>

    </main>

<script src="js/api.js"></script>
<script src="js/vehicles.js"></script>
</body>
</html>
