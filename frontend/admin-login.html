<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SERVEX</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-login-page">
<div class="auth-page">
    <div class="register-backdrop" aria-hidden="true">
        <div class="register-track"></div>
        <div class="register-dust register-dust-left"></div>
        <div class="register-dust register-dust-right"></div>
    </div>

    <div class="auth-card">
        <div class="auth-logo"><img src="assets/servex-logo.svg" alt="SERVEX Bike Care"></div>
        <p class="brand-text">ADMIN PORTAL</p>
        <h1>Administrator Login</h1>
        <p class="subtitle">Manage users, vehicles, bookings and services.</p>

        <div id="adminLoginAlert" class="alert hidden"></div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input id="email" type="email" placeholder="admin@servex.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-field">
                    <input id="password" type="password" placeholder="Admin password" autocomplete="current-password" required>
                    <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" aria-controls="password" title="Show password">
                        <svg data-eye-open viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg data-eye-closed viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle><path d="m3 3 18 18"></path></svg>
                    </button>
                </div>
            </div>

            <button class="btn btn-primary" style="width:100%">
                Login as Administrator
            </button>
        </form>

        <div class="auth-footer">
            <a href="login.html">← User Login</a>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/admin-login.js"></script>
<script src="js/password-toggle.js"></script>
</body>
</html>
