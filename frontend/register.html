<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SERVEX</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="register-page">

<div class="auth-page">
    <div class="register-backdrop" aria-hidden="true">
        <div class="register-track"></div>
        <div class="register-dust register-dust-left"></div>
        <div class="register-dust register-dust-right"></div>
    </div>

    <div class="auth-card">

        <div class="auth-logo"><img src="assets/servex-logo.svg" alt="SERVEX Bike Care"></div>

        <h1>Create Account</h1>
        <p class="subtitle">Register to manage your bike service records.</p>

        <div id="registerAlert" class="alert hidden"></div>

        <form id="registerForm">

            <div class="form-group">
                <label>Full Name</label>
                <input id="fullName" type="text" placeholder="Your full name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input id="email" type="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input id="phone" type="tel" placeholder="10-digit mobile number">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input id="password" type="password" placeholder="Minimum 6 characters" minlength="6" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input id="confirmPassword" type="password" placeholder="Repeat password" required>
            </div>

            <button class="btn btn-primary" style="width:100%">
                Create Account
            </button>

        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</html>
